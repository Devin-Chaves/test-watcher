<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarkers</title>
    <style>

        .longev-bio__carousel {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-bio__carousel::-webkit-scrollbar {
            display: none;
        }

        .longev-bio__track {
            display: flex;
            align-items: stretch;
            padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-caro-card {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <script>
        var testEl = document.createElement('div');
        testEl.className = 'biomarkers-test';
        testEl.textContent = 'Last updated: 2026-02-13 07:05 AM EST';
        document.body.appendChild(testEl);

        function initBiomarkersCarousel() {
            const carousel = document.querySelector('.longev-bio__carousel');
            if (!carousel) {
                setTimeout(initBiomarkersCarousel, 100);
                return;
            }

            const prevBtn = document.querySelector('.longev-bio__controls__prev');
            const nextBtn = document.querySelector('.longev-bio__controls__next');
            const track = carousel.querySelector('.longev-bio__track');

            // Calculate scroll amount dynamically based on viewport and card dimensions
            const getScrollAmount = () => {
                const firstCard = carousel.querySelector('.longev-caro-card');
                if (!firstCard) return 320;

                const trackStyles = track ? window.getComputedStyle(track) : null;
                const gap = trackStyles ? parseInt(trackStyles.gap) || 24 : 24;

                // Get actual rendered card width
                const cardWidth = firstCard.offsetWidth;
                return cardWidth + gap;
            };

            // Update prev button state based on scroll position
            const updateScrollState = () => {
                if (prevBtn) {
                    const isPastFirstCard = carousel.scrollLeft > 1;
                    prevBtn.style.opacity = isPastFirstCard ? '1' : '0.3';
                    prevBtn.style.pointerEvents = isPastFirstCard ? 'auto' : 'none';
                }
            };

            carousel.addEventListener('scroll', updateScrollState);
            updateScrollState();

            if (prevBtn) {
                prevBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const scrollAmount = getScrollAmount();
                    carousel.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const scrollAmount = getScrollAmount();
                    carousel.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                });
            }

            // Recalculate on resize for responsive behavior
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateScrollState, 150);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBiomarkersCarousel);
        } else {
            initBiomarkersCarousel();
        }
    </script>
</body>
</html>
