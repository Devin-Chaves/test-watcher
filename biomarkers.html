<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarkers</title>
    <style>

        .longev-bio__carousel {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding: 0 max(5%, calc((100vw - 74rem) / 2));
            scroll-padding-inline-end: 24px;
        }

        @media (max-width: 768px) {
            .longev-bio__carousel {
                scroll-padding-inline-end: 20px;
            }
        }

        .longev-bio__carousel::-webkit-scrollbar {
            display: none;
        }

        .longev-bio__track {
            display: flex;
            align-items: stretch;
            padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-caro-card {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .longev-bio__controls__prev svg,
        .longev-bio__controls__prev svg * {
            fill: #91908F;
            transition: fill 0.3s ease;
        }

        .longev-bio__controls__next svg,
        .longev-bio__controls__next svg * {
            fill: #31302F;
            transition: fill 0.3s ease;
        }
    </style>
</head>
<body>
    <script>
function initBiomarkersCarousel() {
            const carousels = document.querySelectorAll('.longev-bio__carousel');
            const allControls = document.querySelectorAll('.longev-bio__controls');

            if (carousels.length === 0 || allControls.length === 0) {
                setTimeout(initBiomarkersCarousel, 100);
                return;
            }

            // Setup each carousel with its controls
            carousels.forEach((carousel, index) => {
                const controls = allControls[index] || allControls[0];
                const prevBtn = controls.querySelector('.longev-bio__controls__prev');
                const nextBtn = controls.querySelector('.longev-bio__controls__next');
                const track = carousel.querySelector('.longev-bio__track');

                const getScrollAmount = () => {
                    const firstCard = carousel.querySelector('.longev-caro-card');
                    if (!firstCard) return 320;

                    const trackStyles = track ? window.getComputedStyle(track) : null;
                    const gap = trackStyles ? parseInt(trackStyles.gap) || 24 : 24;
                    return firstCard.offsetWidth + gap;
                };

                const setSvgFill = (btn, color) => {
                    if (!btn) return;
                    btn.querySelectorAll('svg, svg *').forEach(el => el.style.fill = color);
                };

                const updateScrollState = () => {
                    const atStart = carousel.scrollLeft <= 1;
                    const atEnd = carousel.scrollLeft + carousel.clientWidth >= carousel.scrollWidth - 1;

                    setSvgFill(prevBtn, atStart ? '#91908F' : '#31302F');
                    setSvgFill(nextBtn, atEnd ? '#91908F' : '#31302F');
                };

                carousel.addEventListener('scroll', updateScrollState);

                if (prevBtn) {
                    prevBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        carousel.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
                    });
                }

                if (nextBtn) {
                    nextBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        carousel.scrollBy({ left: getScrollAmount(), behavior: 'smooth' });
                    });
                }

                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(updateScrollState, 150);
                });
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBiomarkersCarousel);
        } else {
            initBiomarkersCarousel();
        }
    </script>
</body>
</html>
