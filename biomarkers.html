<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarkers</title>
    <style>

        .longev-bio__carousel {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-bio__carousel::-webkit-scrollbar {
            display: none;
        }

        .longev-bio__track {
            display: flex;
            align-items: stretch;
            padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-caro-card {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <script>
        var testEl = document.createElement('div');
        testEl.className = 'biomarkers-test';
        testEl.textContent = 'Last updated: 2026-02-13 07:36 AM EST';
        document.body.appendChild(testEl);

        function initBiomarkersCarousel() {
            const carousels = document.querySelectorAll('.longev-bio__carousel');
            const allControls = document.querySelectorAll('.longev-bio__controls');

            if (carousels.length === 0 || allControls.length === 0) {
                setTimeout(initBiomarkersCarousel, 100);
                return;
            }

            // Setup each carousel with its controls
            carousels.forEach((carousel, index) => {
                const controls = allControls[index] || allControls[0];
                const prevBtn = controls.querySelector('.longev-bio__controls__prev');
                const nextBtn = controls.querySelector('.longev-bio__controls__next');
                const track = carousel.querySelector('.longev-bio__track');

                const getScrollAmount = () => {
                    const firstCard = carousel.querySelector('.longev-caro-card');
                    if (!firstCard) return 320;

                    const trackStyles = track ? window.getComputedStyle(track) : null;
                    const gap = trackStyles ? parseInt(trackStyles.gap) || 24 : 24;
                    return firstCard.offsetWidth + gap;
                };

                const updateScrollState = () => {
                    if (prevBtn) {
                        const isPastFirstCard = carousel.scrollLeft > 1;
                        prevBtn.style.opacity = isPastFirstCard ? '1' : '0.3';
                        prevBtn.style.pointerEvents = isPastFirstCard ? 'auto' : 'none';
                    }
                };

                carousel.addEventListener('scroll', updateScrollState);
                updateScrollState();

                if (prevBtn) {
                    prevBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        carousel.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
                    });
                }

                if (nextBtn) {
                    nextBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        carousel.scrollBy({ left: getScrollAmount(), behavior: 'smooth' });
                    });
                }

                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(updateScrollState, 150);
                });
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBiomarkersCarousel);
        } else {
            initBiomarkersCarousel();
        }
    </script>
</body>
</html>
