<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarkers</title>
    <style>

        .longev-bio__carousel {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-bio__carousel::-webkit-scrollbar {
            display: none;
        }

        .longev-bio__track {
            display: flex;
            align-items: stretch;
            gap: 16px;
            padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-caro-card {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <script>
        var testEl = document.createElement('div');
        testEl.className = 'biomarkers-test';
        testEl.textContent = 'Last updated: 2026-02-13 05:06 AM EST';
        document.body.appendChild(testEl);
    </script>
</body>
</html>
