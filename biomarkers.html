<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarkers</title>
    <style>

        .longev-bio__carousel {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-bio__carousel::-webkit-scrollbar {
            display: none;
        }

        .longev-bio__track {
            display: flex;
            align-items: stretch;
            padding: 0 max(5%, calc((100vw - 74rem) / 2));
        }

        .longev-caro-card {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <script>
        var testEl = document.createElement('div');
        testEl.className = 'biomarkers-test';
        testEl.textContent = 'Last updated: 2026-02-13 07:33 AM EST';
        document.body.appendChild(testEl);

        function initBiomarkersCarousel() {
            const desktopCarousel = document.querySelector('.longev-bio__carousel:not(.longev-bio__carousel--mobile)');
            const mobileCarousel = document.querySelector('.longev-bio__carousel--mobile');
            const controlsContainer = document.querySelector('.longev-bio__controls');

            if (!controlsContainer || (!desktopCarousel && !mobileCarousel)) {
                setTimeout(initBiomarkersCarousel, 100);
                return;
            }

            const prevBtn = controlsContainer.querySelector('.longev-bio__controls__prev');
            const nextBtn = controlsContainer.querySelector('.longev-bio__controls__next');

            // Get the currently visible carousel
            const getVisibleCarousel = () => {
                if (mobileCarousel && window.getComputedStyle(mobileCarousel).display !== 'none') {
                    return mobileCarousel;
                }
                if (desktopCarousel && window.getComputedStyle(desktopCarousel).display !== 'none') {
                    return desktopCarousel;
                }
                return mobileCarousel || desktopCarousel;
            };

            // Calculate scroll amount for current carousel
            const getScrollAmount = (carousel) => {
                if (!carousel) return 320;
                const firstCard = carousel.querySelector('.longev-caro-card');
                if (!firstCard) return 320;

                const track = carousel.querySelector('.longev-bio__track');
                const trackStyles = track ? window.getComputedStyle(track) : null;
                const gap = trackStyles ? parseInt(trackStyles.gap) || 24 : 24;
                const cardWidth = firstCard.offsetWidth;
                return cardWidth + gap;
            };

            // Update prev button state
            const updateScrollState = () => {
                const activeCarousel = getVisibleCarousel();
                if (prevBtn && activeCarousel) {
                    const isPastFirstCard = activeCarousel.scrollLeft > 1;
                    prevBtn.style.opacity = isPastFirstCard ? '1' : '0.3';
                    prevBtn.style.pointerEvents = isPastFirstCard ? 'auto' : 'none';
                }
            };

            // Add scroll listeners to both carousels
            if (desktopCarousel) {
                desktopCarousel.addEventListener('scroll', updateScrollState);
            }
            if (mobileCarousel) {
                mobileCarousel.addEventListener('scroll', updateScrollState);
            }

            updateScrollState();

            if (prevBtn) {
                prevBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const activeCarousel = getVisibleCarousel();
                    if (activeCarousel) {
                        const scrollAmount = getScrollAmount(activeCarousel);
                        activeCarousel.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    }
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const activeCarousel = getVisibleCarousel();
                    if (activeCarousel) {
                        const scrollAmount = getScrollAmount(activeCarousel);
                        activeCarousel.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    }
                });
            }

            // Update on resize
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateScrollState, 150);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBiomarkersCarousel);
        } else {
            initBiomarkersCarousel();
        }
    </script>
</body>
</html>
